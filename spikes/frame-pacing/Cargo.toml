[package]
name = "frame-pacing"
version = "0.0.0"
edition = "2021"
publish = false
description = "120Hz frame pacing A/B for the new KasaLite renderer (spike)"

# Standalone: keeps the spike out of the app workspace and its lockfile.
[workspace]

[dependencies]
winit = "0.30"
wgpu = "28"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSRunLoop", "NSObject", "NSGeometry", "NSDate"] }
objc2-app-kit = { version = "0.3", features = ["NSResponder", "NSView", "NSEvent", "NSScreen", "NSWindow", "NSGraphicsContext", "objc2-quartz-core"] }
objc2-quartz-core = { version = "0.3", features = ["CADisplayLink", "CAFrameRateRange", "CABase"] }

[profile.release]
lto = "thin"
